<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>VRChat Print Cropper</title>
  </head>
  <body>
    <header class="bar">
      <h1 id="app-title"></h1>
      <div class="bar-actions">
        <button id="open" type="button"></button>
        <label class="language"><span id="language-label"></span> <select id="locale"></select></label>
      </div>
    </header>
    <input id="files" type="file" accept="image/*" multiple hidden />
    <main class="layout">
      <section class="editor">
        <div id="stage" class="stage">
          <canvas id="preview" role="img" hidden></canvas>
          <button id="drop" class="drop" type="button"><span id="drop-label"></span><span id="drop-hint" class="hint"></span></button>
        </div>
        <div id="toolbar" class="toolbar" hidden>
          <p id="caption" class="caption"></p>
          <div id="orient" class="orient"></div>
        </div>
        <ul id="list" class="strip" hidden></ul>
      </section>
      <section class="pane adjust-pane">
        <div class="section-head">
          <h2 id="adjust-title"></h2>
          <button id="auto" type="button"></button>
        </div>
        <div id="sliders" class="sliders"></div>
        <div class="section-head">
          <h2 id="layer-title"></h2>
          <button id="add-layer" type="button"></button>
        </div>
        <ol id="layers" class="layers"></ol>
        <div class="panel-actions">
          <button id="reset" type="button"></button>
          <button id="save" class="primary" type="button"></button>
        </div>
      </section>
    </main>
    <div id="status" class="status" aria-live="polite"></div>
    <footer class="bar"><p id="privacy-note"></p></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
