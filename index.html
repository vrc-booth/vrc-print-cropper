<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRChat Print Cropper</title>
  </head>
  <body>
    <header>
      <h1 id="app-title"></h1>
      <label><span id="language-label"></span> <select id="locale"></select></label>
    </header>
    <main>
      <aside id="list-pane">
        <label class="open"><span id="open-label"></span><input id="files" type="file" accept="image/*" multiple hidden /></label>
        <p id="drop-hint"></p>
        <ul id="list"></ul>
        <p id="list-empty"></p>
      </aside>
      <section id="editor">
        <canvas id="preview" role="img"></canvas>
        <p id="no-selection"></p>
        <div id="controls"></div>
      </section>
    </main>
    <p id="status" aria-live="polite"></p>
    <footer><p id="privacy-note"></p></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
